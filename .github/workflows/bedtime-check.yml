name: Bedtime check

on:
  schedule:
    - cron: "25 2 * * *"
    - cron: "25 3 * * *"
    - cron: "25 4 * * *"
    - cron: "25 5 * * *"
  workflow_dispatch: {}

jobs:
  bedtime-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send bedtime ping (guarded to NY 21:00-02:00)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -u
          if [ -z "${NTFY_TOPIC:-}" ]; then
            echo "NTFY_TOPIC secret is not set."; exit 1
          fi
          HM=$((10#$(TZ=America/New_York date +%H%M)))
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Accept any run landing 21:00-01:59 ET (tolerates Actions cron lateness)
            if [ "$HM" -lt 2100 ] && [ "$HM" -gt 159 ]; then
              echo "Outside NY 21:00-02:00 window, skipping."; exit 0
            fi
          fi
          DOM=$((10#$(TZ=America/New_York date +%d) % 2))
          if [ "$DOM" -eq 0 ]; then
            MSG="Shower night + bed. One tap to dismiss. (Council v1.1)"
          else
            MSG="Bedtime. Day's done - wind down. One tap to dismiss. (Council v1.1)"
          fi
          curl -sS --fail-with-body \
            -H "Title: Council" -H "Tags: bed" -H "Priority: default" \
            -d "$MSG" \
            "https://ntfy.sh/${NTFY_TOPIC}" > /dev/null
          echo "Sent: $MSG"
