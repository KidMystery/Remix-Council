name: Live audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "App URL, no trailing slash (https://something.up.railway.app)"
        required: true

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ inputs.base_url }}
      COUNCIL_KEY: ${{ secrets.COUNCIL_ACCESS_KEY }}
    steps:
      - name: Prep probe script
        run: |
          cat > probe.sh <<'EOF'
          #!/usr/bin/env bash
          set -u
          BASE="${BASE%/}"
          cmd="$1"
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$@"; }
          case "$cmd" in
            health)
              got=$(code "$BASE/api/health"); want=200 ;;
            spa)
              if curl -s --max-time 30 "$BASE/" | grep -qi '<html'; then echo "spa ok"; exit 0
              else echo "no HTML served at /"; exit 1; fi ;;
            gate)
              got=$(code -X POST "$BASE/api/council" -H 'Content-Type: application/json' \
                -d '{"model":"audit/probe","messages":[{"role":"user","content":"ping"}]}'); want=401 ;;
            badkey)
              got=$(code -X POST "$BASE/api/council" -H 'Content-Type: application/json' \
                -H 'x-council-key: definitely-not-the-key' \
                -d '{"model":"audit/probe","messages":[{"role":"user","content":"ping"}]}'); want=401 ;;
            models)
              if [ -n "${COUNCIL_KEY:-}" ]; then
                got=$(code -H "x-council-key: $COUNCIL_KEY" "$BASE/api/council/models"); want=200
              else
                got=$(code "$BASE/api/council/models")
                case "$got" in 200|401|403) echo "models -> $got (ok, no key secret set)"; exit 0;; esac
                want="200/401/403"
              fi ;;
          esac
          echo "$cmd -> $got (want $want)"
          [ "$got" = "$want" ]
          EOF
          chmod +x probe.sh
      - name: "Health: /api/health -> 200"
        if: always()
        run: bash probe.sh health
      - name: "SPA: / serves HTML"
        if: always()
        run: bash probe.sh spa
      - name: "Owner gate CLOSED: anon POST -> 401"
        if: always()
        run: bash probe.sh gate
      - name: "Bogus council key -> 401"
        if: always()
        run: bash probe.sh badkey
      - name: "Models endpoint sane"
        if: always()
        run: bash probe.sh models
