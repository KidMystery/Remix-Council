<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Council Chamber</title>
    <style>
        :root {
            --bg-color: #f5f5f0;
            --text-color: #333333;
            --accent-color: #6d8b74;
            --border-color: #e2e2dd;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 2rem 1rem;
            padding-bottom: 120px; /* Space for sticky input */
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        h1 {
            font-weight: 500;
            margin: 0 0 0.5rem 0;
        }
        .details-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0.6;
            margin-bottom: 2rem;
            display: block;
            margin: 0 auto 2rem;
        }
        .details-toggle:hover {
            opacity: 1;
        }
        .model-details {
            display: none;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }
        .model-details.open {
            display: block;
        }
        
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        
        .message {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .role-label {
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .message-content {
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            white-space: pre-wrap;
        }
        
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-color);
            padding: 1rem;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
        }
        
        .input-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            gap: 0.5rem;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background: #ffffff;
            color: var(--text-color);
            outline: none;
        }
        input[type="text"]:focus {
            border-color: var(--accent-color);
        }
        
        button[type="submit"] {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 500;
        }
        button[type="submit"]:hover {
            opacity: 0.9;
        }
        button[type="submit"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .loading {
            text-align: center;
            font-style: italic;
            opacity: 0.6;
            margin: 2rem 0;
            display: none;
        }
        
        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
        
        .user-topic {
            font-size: 1.2rem;
            font-weight: 500;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Council Chamber</h1>
        </header>

        <button class="details-toggle" onclick="toggleDetails()">⚙️ Details</button>
        
        <div class="model-details" id="modelDetails">
            <p><strong>Models used:</strong> Google Gemini 2.0 Flash</p>
            <p><strong>Process:</strong> Sequential 4-step debate (Analyst -> Creative -> Critic -> Moderator)</p>
            <p><strong>Backend:</strong> Proxy server hides OpenRouter API key</p>
        </div>

        <div class="error" id="errorMessage"></div>
        
        <div class="user-topic" id="currentTopic"></div>

        <div class="timeline" id="timeline">
            <!-- Messages will appear here -->
        </div>
        
        <div class="loading" id="loadingIndicator">
            The Council is deliberating...
        </div>
    </div>

    <form class="input-area" id="debateForm">
        <div class="input-container">
            <input type="text" id="topicInput" placeholder="Enter a topic for the council to debate..." required autocomplete="off">
            <button type="submit" id="submitBtn">Submit</button>
        </div>
    </form>

    <script>
        function toggleDetails() {
            const el = document.getElementById('modelDetails');
            el.classList.toggle('open');
        }

        function createMessageElement(role, icon, content) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            
            const roleDiv = document.createElement('div');
            roleDiv.className = 'role-label';
            roleDiv.innerHTML = `${icon} ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            msgDiv.appendChild(roleDiv);
            msgDiv.appendChild(contentDiv);
            
            return msgDiv;
        }

        document.getElementById('debateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const input = document.getElementById('topicInput');
            const submitBtn = document.getElementById('submitBtn');
            const timeline = document.getElementById('timeline');
            const loading = document.getElementById('loadingIndicator');
            const errorDiv = document.getElementById('errorMessage');
            const topicDisplay = document.getElementById('currentTopic');
            
            const topic = input.value.trim();
            if (!topic) return;
            
            // Reset UI
            input.value = '';
            input.disabled = true;
            submitBtn.disabled = true;
            timeline.innerHTML = '';
            errorDiv.style.display = 'none';
            loading.style.display = 'block';
            
            topicDisplay.textContent = `Topic: "${topic}"`;
            topicDisplay.style.display = 'block';
            
            try {
                const response = await fetch('/api/debate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch debate results');
                }
                
                // Append messages sequentially for a nice effect, or all at once
                timeline.appendChild(createMessageElement('Analyst', '🌞', data.analyst));
                timeline.appendChild(createMessageElement('Creative', '🌸', data.creative));
                timeline.appendChild(createMessageElement('Critic', '🌧️', data.critic));
                timeline.appendChild(createMessageElement('Moderator', '⚖️', data.moderator));
                
                // Scroll to bottom
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                
            } catch (err) {
                errorDiv.textContent = `Error: ${err.message}`;
                errorDiv.style.display = 'block';
            } finally {
                input.disabled = false;
                submitBtn.disabled = false;
                loading.style.display = 'none';
                input.focus();
            }
        });
    </script>
</body>
</html>
